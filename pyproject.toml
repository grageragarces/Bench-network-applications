[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "qnetbench"
version = "0.0.1"
description = "A benchmark suite and workload-characterization framework for quantum-network applications."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "qnetbench contributors" }]
keywords = [
    "quantum-network",
    "benchmark",
    "quantum-internet",
    "entanglement",
    "simulator",
    "workload-characterization",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "pydantic>=2.5",
    "numpy>=1.24",
]

[project.optional-dependencies]
sequence = ["sequence>=0.6"]
netsquid = []  # NetSquid is not on public PyPI; install per its own instructions.
dev = [
    "pytest>=8.0",
    "mypy>=1.8",
    "ruff>=0.4",
]

[project.scripts]
qnetbench = "qnetbench.harness.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["qnetbench"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
# Analysis interpreter: newer numpy ships 3.12 stubs, so type-check as 3.12.
# Runtime support stays >=3.10 (ruff's target-version enforces that syntax).
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
disallow_untyped_defs = true
# Optional simulator backends are exercised behind extras; don't fail core typing on them.
[[tool.mypy.overrides]]
module = ["sequence.*", "netsquid.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
